<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>In Tem QR</title>
    <style>
        @page {
            size: 25mm 13mm;
            margin: 0mm !important;
        }

        @media print {

            body,
            html {
                width: 25mm;
                height: 13mm;
                margin: 0 !important;
                padding: 0 !important;
                background-color: white;
            }

            .qr-container {
                display: block !important;
            }

            .qr-item {
                width: 25mm !important;
                height: 13mm !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
                page-break-after: always;
                overflow: hidden;
            }

            .qr-item img {
                width: 100% !important;
                height: 100% !important;
                object-fit: contain !important;
                display: block;
            }

            .no-print {
                display: none !important;
            }
        }

        @media screen {
            body {
                font-family: 'Segoe UI', Arial, sans-serif;
                background-color: #f4f4f4;
                margin: 20px;
            }

            .qr-container {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
            }

            .qr-item {
                background: white;
                padding: 15px;
                border: 1px solid #ddd;
                border-radius: 8px;
                text-align: center;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                width: 200px;
                /* Khung cố định để xem trên màn hình */
            }

            .qr-item img {
                width: 177px;
                height: 94px;
                display: block;
                margin: 0 auto;
                border: 1px solid #eee;
            }

            .qr-label {
                margin-top: 10px;
                font-size: 20px;
                font-weight: bold;
                color: #333;
                text-align: left;
                /* Căn lề trái giống ảnh bạn gửi */

                /* 1. Xử lý tên sản phẩm và mã gộp chung */
                display: -webkit-box;
                -webkit-box-orient: vertical;
                overflow: hidden;

                /* 2. Ép toàn bộ nội dung phải hiển thị, mã không được khuyết */
                word-break: break-all !important;
                white-space: normal !important;
                line-height: 1.3;
            }

            /* Tạo hiệu ứng ... cho tên sản phẩm (nếu bạn có thể can thiệp nội dung) */
            /* Ở đây mình dùng CSS để giới hạn tổng số dòng hiển thị là 3 dòng 
               để đảm bảo Mã luôn xuất hiện ở dòng cuối và không bị mất */
            .qr-label {
                display: -webkit-box;
                -webkit-line-clamp: 4;
                /* Cho phép hiển thị tối đa 4 dòng để chứa cả tên và mã */
                -webkit-box-orient: vertical;
            }
        }
    </style>
</head>

<link rel="stylesheet" href="{{ url_for('static', filename='vendor/sweetalert2.min.css') }}">
<script src="{{ url_for('static', filename='vendor/sweetalert2.all.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/global_modal.js') }}"></script>

<body onload="window.print()">
    <div class="qr-container">
        {% for item in qrs %}
        <div class="qr-item">
            <img src="{{ url_for('static', filename='qr/' + item.uuid + '.png') }}" alt="QR Code">
            <div class="qr-label no-print">
                Mã: {{ item.uuid }}
            </div>
        </div>
        {% endfor %}
    </div>
</body>

</html>
